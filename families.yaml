# Botanical families, used for crop rotation. id: lower-case family name.
- id: amaranthaceae
  name: Amaranthaceae
  commonName: Amaranth family (beet, chard, spinach)
- id: amaryllidaceae
  name: Amaryllidaceae
  commonName: Onion family (onion, garlic, leek)
- id: apiaceae
  name: Apiaceae
  commonName: Carrot family (carrot, parsnip, celery, dill)
- id: asteraceae
  name: Asteraceae
  commonName: Daisy family (lettuce, sunflower, endive)
- id: brassicaceae
  name: Brassicaceae
  commonName: Cabbage family (cabbage, kale, broccoli, radish)
- id: cucurbitaceae
  name: Cucurbitaceae
  commonName: Gourd family (cucumber, squash, melon)
- id: fabaceae
  name: Fabaceae
  commonName: Legume family (bean, pea)
- id: lamiaceae
  name: Lamiaceae
  commonName: Mint family (basil, mint, oregano)
- id: poaceae
  name: Poaceae
  commonName: Grass family (corn)
- id: rosaceae
  name: Rosaceae
  commonName: Rose family (apple, pear, strawberry, raspberry)
- id: solanaceae
  name: Solanaceae
  commonName: Nightshade family (tomato, pepper, potato, eggplant)
