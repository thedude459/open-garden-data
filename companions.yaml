# Keep apart
- crops: [tomato, potato]
  kind: hinders
  benefits: [shares-pests]
  evidence: extension
  reason: Both get late blight, and the same strains move between them. Infected potato tubers are a common way it starts. Keep them apart and rotate.
  shownIn:
    - where: Minnesota, USA
      zones: { min: 3, max: 5 }
  reference: University of Minnesota Extension, "Late blight of tomato and potato"
  source: hand-curation
- crops: [potato, eggplant]
  kind: hinders
  benefits: [shares-pests]
  evidence: extension
  reason: Colorado potato beetle feeds on both. In Minnesota trials, eggplant did not work as a trap crop to protect potatoes.
  shownIn:
    - where: Minnesota, USA
      zones: { min: 3, max: 5 }
  reference: University of Minnesota Extension, "Colorado potato beetle"
  source: hand-curation
- crops: [tomato, sweet-corn]
  kind: hinders
  benefits: [shares-pests]
  evidence: extension
  reason: Corn earworm is also the tomato fruitworm; planting the two together makes it easier for the pest to spread between them.
  shownIn:
    - where: South Carolina, USA
      zones: { min: 7, max: 9 }
  reference: Clemson
  source: hand-curation
