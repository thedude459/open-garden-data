# Tomato
- crops: [marigold, tomato]
  kind: helps
  benefits: [deters-pests]
  evidence: research
  reason: French marigold protected tomatoes from greenhouse whitefly through the limonene it gives off, and marigold reduced thrips on tomatoes in field and greenhouse studies.
  shownIn:
    - where: Greenhouse, United Kingdom
  reference: Conboy et al. (2019), PLOS ONE 14(3) e0213071; UMN
  source: hand-curation
- crops: [basil, tomato]
  kind: helps
  benefits: [deters-pests]
  evidence: research
  reason: Basil interplanted with tomatoes reduced thrips and, under net covers, whiteflies, and may help tomato growth.
  shownIn:
    - where: Kenya (open field)
    - where: Greenhouse, Japan
    - where: South Carolina, USA
      zones: { min: 7, max: 9 }
  reference: Mutisya et al. (2016), Agronomy 6(3) 42; Ahmad et al. (2020), American Journal of Plant Sciences 11; UMN; Clemson
  source: hand-curation

# Lettuce
- crops: [cilantro, lettuce]
  kind: helps
  benefits: [attracts-beneficials]
  evidence: extension
  reason: Flowering coriander feeds adult hoverflies, whose larvae eat lettuce aphids. Organic growers intercrop it with lettuce for that reason.
  shownIn:
    - where: California Central Coast, USA
      zones: { min: 9, max: 10 }
  reference: UC IPM
  source: hand-curation
- crops: [sweet-alyssum, lettuce]
  kind: helps
  benefits: [attracts-beneficials]
  evidence: extension
  reason: Sweet alyssum feeds adult hoverflies, whose larvae eat lettuce aphids. Skip it where Bagrada bug is building up; it is one of that pest's favorite hosts.
  shownIn:
    - where: California Central Coast, USA
      zones: { min: 9, max: 10 }
  reference: UC IPM
  source: hand-curation

# Three sisters and space sharing
- crops: [sweet-corn, pole-bean]
  kind: helps
  benefits: [support, fixes-nitrogen]
  evidence: extension
  reason: Corn stalks give pole beans something to climb, and the beans fix nitrogen. Part of the three sisters planting of corn, beans, and squash.
  shownIn:
    - where: Minnesota, USA
      zones: { min: 3, max: 5 }
    - where: South Carolina, USA
      zones: { min: 7, max: 9 }
  reference: UMN; Clemson
  source: hand-curation
- crops: [sweet-corn, winter-squash]
  kind: helps
  benefits: [ground-cover, shade]
  evidence: extension
  reason: Squash vines cover and shade the soil under the corn, holding moisture and keeping weeds down. Part of the three sisters planting.
  shownIn:
    - where: Minnesota, USA
      zones: { min: 3, max: 5 }
    - where: South Carolina, USA
      zones: { min: 7, max: 9 }
  reference: UMN; Clemson
  source: hand-curation

