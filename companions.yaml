# Companion pairs: advice, never a rule. Each pair says what it does
# (benefits), how well it is known (evidence), where it was shown (shownIn,
# with USDA hardiness zones so apps can rank pairs shown near a garden first),
# and the studies or extension guides behind it (reference). The facts are
# written in our own words; see CONTRIBUTING.md.
#
# References used below:
#   UMN = University of Minnesota Extension, "Companion planting in home
#         gardens" (N. Hoidal, reviewed 2026)
#   Clemson = Clemson Cooperative Extension HGIC, "Plant Partners: 5 Benefits
#         of Companion Planting" (J. Nichols, 2025); "Can Plants Repel
#         Problematic Insects?" (J. Jordan, 2025); "Cucumber, Squash, Melon &
#         Other Cucurbit Insect Pests"
#   UC IPM = UC Statewide IPM Program, "Lettuce aphid" (Pest Management
#         Guidelines: Lettuce)

# Trap crops and deterrents for squash and cucumber pests
- crops: [winter-squash, summer-squash]
  kind: helps
  benefits: [trap-crop]
  evidence: research
  reason: Blue Hubbard squash draws squash bugs, striped cucumber beetles, and squash vine borers away from other squash. Plant it around the edge and manage the pests on it.
  shownIn:
    - where: Missouri, USA
      zones: { min: 6, max: 6 }
    - where: Minnesota, USA
      zones: { min: 3, max: 5 }
    - where: South Carolina, USA
      zones: { min: 7, max: 9 }
  reference: Pinero (2017), University of Missouri Environment & Garden; UMN; Clemson (Hubbard types are the most damaged by squash bug)
  source: hand-curation
- crops: [winter-squash, cucumber]
  kind: helps
  benefits: [trap-crop]
  evidence: extension
  reason: Blue Hubbard squash pulls striped cucumber beetles away from nearby cucumbers.
  shownIn:
    - where: Minnesota, USA
      zones: { min: 3, max: 5 }
  reference: UMN
  source: hand-curation
- crops: [nasturtium, summer-squash]
  kind: helps
  benefits: [deters-pests]
  evidence: research
  reason: Nasturtium planted with squash reduced squash bugs, and in an Iowa trial reduced squash bug and cucumber beetle damage.
  shownIn:
    - where: Iowa, USA
      zones: { min: 5, max: 5 }
  reference: Riesselman (2006), Iowa State Research Farm Progress Reports 295; Doughty et al. (2016), Journal of Integrated Pest Management 7(1); UMN
  source: hand-curation
- crops: [marigold, summer-squash]
  kind: helps
  benefits: [deters-pests, attracts-beneficials]
  evidence: research
  reason: Marigold reduced squash bug and cucumber beetle damage in an Iowa trial, and marigold with sweet alyssum raised the natural enemies of aphids on squash in Florida.
  shownIn:
    - where: Iowa, USA
      zones: { min: 5, max: 5 }
    - where: Florida, USA
      zones: { min: 9, max: 9 }
  reference: Riesselman (2006), Iowa State Research Farm Progress Reports 295; Lopez & Liburd (2019), SARE report GS17-171; UMN
  source: hand-curation
- crops: [sweet-alyssum, summer-squash]
  kind: helps
  benefits: [attracts-beneficials]
  evidence: research
  reason: Sweet alyssum with marigold raised the natural enemies of aphids on squash and slightly improved yield.
  shownIn:
    - where: Florida, USA
      zones: { min: 9, max: 9 }
  reference: Lopez & Liburd (2019), SARE report GS17-171; UMN
  source: hand-curation

