# Every guide, paper, database, and regulation the dataset cites, once each.
# A reference is not a data source: the facts are written in our own words,
# and sources.yaml lists where data comes from. Entries cite these by id in
# `references`; the free-text `reference` beside it stays for readers.
#
#   kind      extension | journal | report | database | regulation
#   url       the page itself; a weekly link check reports any that break.
#             Left out only when no checkable address is known (say why in
#             note).
#   terms     what the publisher says about reuse, where it matters

