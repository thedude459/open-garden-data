name: Release

# Run from Actions -> Release -> Run workflow, on main, with the version
# (CONTRIBUTING.md, "Changelog and releases"). It builds
# open-garden-catalog-<version>.json, its SHA-256, and a build provenance
# attestation, and publishes them with the release-file schema in a GitHub
# Release, which creates the tag. The notes are the version's CHANGELOG.md
# entry in the release notes template layout, then what changed in the data
# since the previous release. The app pins a version.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 0.3.0 (CHANGELOG.md must have "## v0.3.0 (date)")'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  catalog:
    name: build catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Create the release with its assets; sign the catalog with a provenance attestation.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache when publishing: a poisoned cache could alter the artifact.
          package-manager-cache: false
      - name: Check the version and branch
        id: tag
        env:
          INPUT: ${{ inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${INPUT#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 0.3.0, got ${INPUT}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Run the release from main (got ${GITHUB_REF})" >&2
            exit 1
          fi
          if gh release view "v${VERSION}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "Release v${VERSION} already exists" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
      - run: npm ci --ignore-scripts
      - name: Notes from CHANGELOG.md
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        # Fails when CHANGELOG.md has no entry for this version.
        run: |
          node scripts/catalog.mjs changelog-check
          node scripts/catalog.mjs changelog "${VERSION}" > changelog.md
      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: npm run build -- "${VERSION}"
      - name: Sign the catalog (build provenance)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/open-garden-catalog-${{ steps.tag.outputs.version }}.json
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # Verify with: gh attestation verify open-garden-catalog-<version>.json --owner <owner>
          NAME="open-garden-catalog-${VERSION}.json"
          cp "${BUNDLE}" "dist/${NAME}.sigstore.json"

          # What changed since the newest published release.
          PREV="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | head -n 1 || true)"
          PREV_FILE=""
          if [[ -n "${PREV}" ]]; then
            mkdir -p prev
            if gh release download "${PREV}" --repo "${GITHUB_REPOSITORY}" --dir prev \
              --pattern "open-garden-catalog-${PREV#v}.json"; then
              PREV_FILE="prev/open-garden-catalog-${PREV#v}.json"
            fi
          fi
          CHANGES="dist/open-garden-catalog-${VERSION}.changes.md"
          node scripts/catalog.mjs notes "dist/${NAME}" ${PREV_FILE:+"${PREV_FILE}"} > "${CHANGES}"
          { cat changelog.md; printf '\n'; cat "${CHANGES}"; } > body.md
          cat body.md >> "${GITHUB_STEP_SUMMARY}"
          gh release create "${TAG}" "dist/${NAME}" "dist/${NAME}.sha256" "dist/${NAME}.sigstore.json" \
            "${CHANGES}" schema/catalog.schema.json schema/crop.schema.json \
            --repo "${GITHUB_REPOSITORY}" --target "${GITHUB_SHA}" --title "${TAG}" --notes-file body.md
