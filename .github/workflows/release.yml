name: Release

# Publishing a GitHub Release tagged vMAJOR.MINOR.PATCH builds
# open-garden-catalog-<version>.json, its SHA-256, and a build provenance
# attestation, and attaches them to the release with what changed since the
# previous release and the release-file schema. The app pins a version.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  catalog:
    name: build catalog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Upload release assets; sign the catalog with a provenance attestation.
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # No dependency cache when publishing: a poisoned cache could alter the artifact.
          package-manager-cache: false
      - name: Check the tag is vMAJOR.MINOR.PATCH
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must look like v0.1.0, got ${TAG}" >&2
            exit 1
          fi
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"
      - run: npm ci --ignore-scripts
      - name: Build
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: npm run build -- "${VERSION}"
      - name: Sign the catalog (build provenance)
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/open-garden-catalog-${{ steps.tag.outputs.version }}.json
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.tag.outputs.version }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          # Verify with: gh attestation verify open-garden-catalog-<version>.json --owner <owner>
          NAME="open-garden-catalog-${VERSION}.json"
          cp "${BUNDLE}" "dist/${NAME}.sigstore.json"
          gh release upload "${TAG}" "dist/${NAME}" "dist/${NAME}.sha256" "dist/${NAME}.sigstore.json" \
            --clobber --repo "${GITHUB_REPOSITORY}"
      - name: Release notes and schema
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # What changed since the newest other published release, appended to
          # this release's description and attached; plus the release-file schema.
          PREV="$(gh release list --repo "${GITHUB_REPOSITORY}" --exclude-drafts --exclude-pre-releases \
            --json tagName --jq '.[].tagName' | grep -vx "${TAG}" | head -n 1 || true)"
          PREV_FILE=""
          if [[ -n "${PREV}" ]]; then
            mkdir -p prev
            if gh release download "${PREV}" --repo "${GITHUB_REPOSITORY}" --dir prev \
              --pattern "open-garden-catalog-${PREV#v}.json"; then
              PREV_FILE="prev/open-garden-catalog-${PREV#v}.json"
            fi
          fi
          node scripts/catalog.mjs notes "dist/open-garden-catalog-${VERSION}.json" ${PREV_FILE:+"${PREV_FILE}"} \
            > "dist/open-garden-catalog-${VERSION}.changes.md"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json body --jq .body > body.md
          if ! grep -q '^## Changes in the data since' body.md; then
            printf '\n\n' >> body.md
            cat "dist/open-garden-catalog-${VERSION}.changes.md" >> body.md
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --notes-file body.md
          fi
          gh release upload "${TAG}" "dist/open-garden-catalog-${VERSION}.changes.md" \
            schema/catalog.schema.json schema/crop.schema.json --clobber --repo "${GITHUB_REPOSITORY}"
