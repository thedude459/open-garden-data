name: Check wording

# Values must be in our own words (CONTRIBUTING.md). Compare each value that
# cites a reference with the page it points to and fail on 8 or more words in
# a row shared with it (scripts/wording.mjs). Runs on pull requests that
# change pests or companions, and weekly, since a guide can change too. It
# needs the network, so it is not a required check.
on:
  pull_request:
    paths:
      - 'pests.yaml'
      - 'companions.yaml'
      - 'references.yaml'
      - 'scripts/wording.mjs'
      - '.github/workflows/wording.yml'
  schedule:
    - cron: '17 7 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wording:
    name: wording
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check:wording
