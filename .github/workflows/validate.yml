name: Validate

# Every pull request and push to main: the dataset must pass the schema and
# the cross-file checks in scripts/catalog.mjs.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run validate
      - run: npm test
      - name: Completeness report
        run: npm run report >> "$GITHUB_STEP_SUMMARY"

  changelog:
    name: changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: CHANGELOG.md is well formed
        run: node scripts/catalog.mjs changelog-check
      - name: The pull request adds its line to CHANGELOG.md
        # Dependabot's updates and changes to scripts, CI, or the roadmap only
        # (label skip-changelog) need no entry.
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          !contains(github.event.pull_request.labels.*.name, 'skip-changelog')
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --name-only "${BASE_SHA}...HEAD" | grep -qx 'CHANGELOG.md'; then
            echo "Add a line to CHANGELOG.md under Unreleased, in the section it belongs to," >&2
            echo "or label the pull request skip-changelog if it changes only scripts, CI, or the roadmap." >&2
            exit 1
          fi
