# Every source the dataset draws on. Only sources whose terms allow CC0 output:
# no share-alike (CC BY-SA) or non-commercial licenses. The validator enforces
# the license list and the kinds:
#   reference  - authoritative taxonomy (scientific names, families)
#   curation   - values written and reviewed by contributors in their own words
#   bootstrap  - a starting point that a curator must check before it counts
- id: hand-curation
  name: Contributor curation
  kind: curation
  license: CC0-1.0
  url: https://github.com/thedude459/open-garden-data
  note: Values written by contributors in their own words, cross-checked against extension-service guides and seed packets. Facts are not copyrightable; prose is.
- id: usda-plants
  name: USDA PLANTS Database
  kind: reference
  license: Public domain
  url: https://plants.usda.gov/
- id: wikidata
  name: Wikidata
  kind: reference
  license: CC0-1.0
  url: https://www.wikidata.org/
- id: openfarm-rescue
  name: OpenFarm crops rescue
  kind: bootstrap
  license: CC0-1.0
  url: https://github.com/thefullnacho/openfarm-crops-rescue
  note: CC0 is claimed for the archive; check each record before use.
