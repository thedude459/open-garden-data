notes: A tall celery-flavored perennial, 90 to 120 cm, for rich, fairly moist soil; light shade helps in hot summers. Seed is sown in late summer, and young plants or divisions are set out in early spring; the window is that of chives, since the guides give no frost-anchored date. Zones come from seed-company guides (Johnny's Seeds), as extension guides give none. Values from Maryland, Illinois, and Missouri extension guides.
