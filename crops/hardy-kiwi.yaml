notes: Kiwiberry, a vigorous vine up to 12 m long with smooth, grape-sized fruit. Plants are male or female, so plant a male within about 12 m of the females; only Issai sets some fruit alone. Needs a sturdy trellis. Hardy to about -23 to -32 °C, but late spring frost can kill new shoots. Values from Utah State extension and the Fedco Trees catalog (2026); crop coefficients from FAO-56 Table 12 (kiwi).
