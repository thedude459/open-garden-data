notes: Scorzonera, a long black-skinned root grown like salsify. Needs deep, loose soil worked 45 to 60 cm down for straight roots, and even moisture. The guide says to sow as soon as the soil can be worked, so the window is that of salsify. Values from Utah State extension. Crop coefficients are FAO-56 Table 12's root and tuber group values.
