notes: Not self-fruitful; plant a second almond variety, or a peach that blooms at the same time. It blooms very early, and frost below about -2 °C during or after bloom kills the flowers, so it suits warm, low sites with mild springs and needs 400 to 500 hours below 7 °C in winter. Values from Utah State, University of California, and Oregon State guides; crop coefficients from FAO-56 Table 12.
