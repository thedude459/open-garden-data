varieties:
  - id: almond-nonpareil
    name: Nonpareil
    notes: The leading California almond, with flat kernels of excellent quality; ripens late August there.
  - id: almond-mission
    name: Mission
    notes: Also sold as Texas. Ripens 40 to 60 days after Nonpareil, with a hard shell and strongly flavored kernels.
  - id: almond-all-in-one
    name: All-in-One
    notes: Paper-shelled and sweet; sold as hardy to zone 5, partly dwarfing, and self-fruitful.
notes: Not self-fruitful; plant a second almond variety, or a peach that blooms at the same time. It blooms very early, and frost below about -2 °C during or after bloom kills the flowers, so it suits warm, low sites with mild springs and needs 400 to 500 hours below 7 °C in winter. Values from Utah State, University of California, and Oregon State guides; crop coefficients from FAO-56 Table 12.
