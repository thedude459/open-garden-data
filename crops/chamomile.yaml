notes: German (annual) chamomile, picked for tea as the flowers open fully. Seed needs light to germinate, so press it onto the surface. Thrives in poor, well-drained soil and self-sows freely. Values from Wisconsin, University of California, and Texas A&M guides. Crop coefficients from Pereira et al. (2024), Irrigation Science 42:1199–1228, doi:10.1007/s00271-024-00960-4 (CC BY 4.0).
