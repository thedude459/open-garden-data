notes: Chinese cabbage with tall, tight heads. A late frost or a week of nights below about 10 °C makes spring plants bolt, and heat as heads form loosens them, so a crop sown in midsummer to head in cool fall weather is the more reliable one. Values from Minnesota, Maryland, Penn State, and Washington State extension guides. Crop coefficients from Pereira et al. (2024), Irrigation Science 42:1199–1228, doi:10.1007/s00271-024-00960-4 (CC BY 4.0).
