varieties:
  - id: peach-redhaven
    name: Redhaven
notes: Self-fertile, so one tree is enough. It blooms early, and a late spring frost can take the crop even where the tree itself is hardy; plant on a slope rather than in a frost pocket. Fruits on last year's wood, so prune every year to an open centre.
