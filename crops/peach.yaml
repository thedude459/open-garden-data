rootstocks:
  dwarf:
    spacingCm: { inRow: 300, betweenRows: 450 }
    heightM: { min: 2, max: 3.5 }
    yearsToFruit: { min: 2, max: 3 }
  semiDwarf:
    spacingCm: { inRow: 450, betweenRows: 550 }
    heightM: { min: 3.5, max: 5 }
    yearsToFruit: { min: 3, max: 4 }
    named:
      - id: mp-29
        name: MP-29
        sizePercent: { min: 40, max: 75 }
        notes: Semi-dwarf, about 40 to 75 percent the size of trees on Guardian depending on site; resists peach tree short life and Armillaria root rot.
  standard:
    spacingCm: { inRow: 600, betweenRows: 750 }
    heightM: { min: 5, max: 7 }
    yearsToFruit: { min: 3, max: 5 }
    named:
      - id: lovell
        name: Lovell
        sizePercent: { min: 100, max: 100 }
        notes: The long-standing reference rootstock, with good anchorage, high survival in northern trials, and more cold hardiness than Nemaguard, but suffers in waterlogged soil.
      - id: bailey
        name: Bailey
        notes: Recommended in Ontario; gives uniform medium to large trees, lends some cold hardiness to the variety, and survives severe winters well. Slightly dwarfing.
      - id: guardian
        name: Guardian
        notes: Preferred in the Southeast for tolerance of peach tree short life.
      - id: krymsk-86
        name: Krymsk 86
        notes: Hardy to USDA zone 4 with excellent anchorage, and tolerates wet soil; prone to bacterial canker in the Southeast.
      - id: halford
        name: Halford
        notes: An older, vigorous rootstock.
      - id: nemaguard
        name: Nemaguard
        notes: Needs well-drained soil, as it is very susceptible to wet feet, and is less cold hardy than Lovell; best only where stone fruit has not been grown before.
soilPh: { min: 6.0, max: 7.0 }
