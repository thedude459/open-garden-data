notes: Usually planted as bulb sets, 2.5 to 5 cm deep. Close spacing gives single bulbs, wider spacing clusters of up to a dozen. Lift when the tops fall over, and stop feeding by midsummer so the bulbs store. Plant in early spring or, where winters allow, in fall. Values from Utah State, Washington State, and Maryland extension guides; crop coefficients from FAO-56 Table 12 (dry onions).
