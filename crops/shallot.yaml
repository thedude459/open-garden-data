notes: Usually planted as bulb sets, 2.5 to 5 cm deep. Close spacing gives single bulbs, wider spacing clusters of up to a dozen. Lift when the tops fall over, and stop feeding by midsummer so the bulbs store. The guides say only to plant sets as soon as the soil can be worked; the window here assumes that is two to four weeks before the last frost, as for onion sets. Values from Utah State and Washington State extension guides; crop coefficients from FAO-56 Table 12 (dry onions).
