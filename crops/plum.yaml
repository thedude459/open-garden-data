notes: European plum. Many are self-fruitful but bear more with a second European variety nearby. Japanese plums (zones 5 to 9) need a Japanese or American plum to pollinate them, as European plum pollen does not work. Poor in wet or heavy soil. Values from Utah State and Alabama extension guides; crop coefficients from FAO-56 Table 12 (stone fruit).
