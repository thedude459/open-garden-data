notes: Its flowers draw lacewings, lady beetles, parasitic wasps, and tachinid flies, which prey on aphids, whiteflies, and caterpillars. As a companion for potatoes it did not reduce Colorado potato beetle in field trials. Invasive in much of North America and a listed noxious weed in several states; check local rules. Toxic to people and livestock. Spreads by roots and seed, so grow it contained and cut flowers before they set seed.
