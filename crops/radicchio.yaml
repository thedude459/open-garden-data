notes: A heading chicory with bitter red leaves. Young plants take frost down to about -7 °C, but heat above about 24 °C makes it bolt and turn bitter, so it does best maturing in cool weather. Sow a few seeds for each plant, as germination is uneven. Grown as an annual, though chicory is a perennial. Values from Utah State and Washington State extension guides. Crop coefficients are FAO-56 Table 12's small-vegetable group values; FAO-56 does not list radicchio.
