notes: Tart or pie cherry, such as Montmorency. Self-fruitful, so one tree is enough, and hardier than sweet cherry. Sweet and sour cherries cannot pollinate each other. Compact varieties such as North Star stay near 3 m. Values from Penn State, Oregon State, Illinois, Minnesota, and New Hampshire extension guides; crop coefficients from FAO-56 Table 12 (cherries).
