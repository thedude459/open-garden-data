notes: A woody, short-lived perennial; replace plants every few years as they turn leggy. Needs excellent drainage and tolerates drought. Cut it back in spring and through summer for fresh shoots, never more than half the plant at once. Days to maturity are to the first harvest. Values from Wisconsin, Clemson, Missouri, and Texas A&M extension guides.
