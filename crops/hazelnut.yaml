notes: American hazelnut and its hybrids, hardy to zone 3 or 4; European filberts are less hardy. Every hazelnut needs another to pollinate it, so plant two or three within about 15 m. Starts bearing in about five or six years. Usually kept as a shrub about 4.5 m tall and 3 m wide; in orchards space plants 4.5 to 6 m apart. Values from Utah State and Oregon State guides.
