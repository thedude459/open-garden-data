notes: Grown for its swollen stem; pick it at 5 to 8 cm across, before it turns woody. A week or more of nights below about 10 °C can make young plants bolt, and summer heat makes the stems tough, so grow it in spring or fall. Values from Utah State, Minnesota, and Colorado State extension guides. Crop coefficients are FAO-56 Table 12's small-vegetable group values; FAO-56 does not list kohlrabi.
