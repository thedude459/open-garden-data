notes: The sweetleaf herb. It does not take frost and barely grows below about 15 °C, so set plants out after the last frost once nights stay above about 10 °C, and pinch the tips for bushier plants. Outside zones 9 to 11 grow it as an annual or bring it indoors. Zones and spacing from seed-company guides (Johnny's Seeds), as extension guides give none. Crop coefficients from Pereira et al. (2024), Irrigation Science 42:1199–1228, doi:10.1007/s00271-024-00960-4 (CC BY 4.0).
