notes: Flat, mildly garlic-flavored leaves and white late-summer flowers. It self-sows heavily and can spread, so cut the flower heads before they set seed. Clumps can be divided in early spring. The guides give no frost-anchored dates, so the windows are those of chives. Values from Wisconsin, New Hampshire, and Clemson extension guides.
