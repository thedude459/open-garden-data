notes: A tender grass grown from divisions or rooted stalks, planted out once frost has passed; it grows slowly until summer heat, then up to 1 to 2 m tall and about 1 m wide with plenty of water. Outside zones 9 and 10, grow it in a pot or keep a rooted piece of the stalk base indoors over winter. Values from Utah State and Clemson extension guides.
