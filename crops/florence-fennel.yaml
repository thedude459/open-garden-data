notes: The bulbing fennel, not the seed fennel grown as an herb. Keep the soil evenly moist; drought, root damage, long days, and heat make it bolt, so pick a slow-bolting variety and time it to mature in cool weather. Sow a short row every three to four weeks for a steady supply. Values from Utah State extension. Crop coefficients are FAO-56 Table 12's small-vegetable group values; FAO-56 does not list fennel.
