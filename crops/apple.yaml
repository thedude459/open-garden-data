id: apple
names:
  en: Apple
scientificName: Malus domestica
wikidataId: Q18674606
family: rosaceae
habit: tree
use: fruit
lifeCycle: perennial
frostTolerance: hardy
hardinessZones: { min: 3, max: 8 }
sun: full
water: moderate
feeding: moderate
spacingCm:
  inRow: 420
  betweenRows: 540
rootstocks:
  dwarf:
    spacingCm: { inRow: 240, betweenRows: 360 }
    heightM: { min: 2.5, max: 3.5 }
    yearsToFruit: { min: 2, max: 3 }
    named:
      - id: bud-9
        name: Bud 9 (B.9)
        sizePercent: { min: 25, max: 45 }
        support: always
        notes: Very winter hardy (zone 4), with the least spring-frost bud loss in Virginia Tech trials. Prone to collar rot and replant disease, so plant it on well-drained, fresh ground.
      - id: m9
        name: M.9
        sizePercent: { min: 30, max: 50 }
        support: always
        notes: Brittle roots, so stake it for life; extremely sensitive to fire blight. Occasionally winter injured in Kentucky, and among the least cold hardy in Cornell and Virginia Tech trials.
      - id: g41
        name: G.41
        sizePercent: { min: 30, max: 45 }
        support: always
        notes: Winter hardy; tolerates fire blight, collar rot, woolly apple aphid, and replant disease. Needs irrigation on light soils.
      - id: g11
        name: G.11
        sizePercent: { min: 35, max: 50 }
        support: always
        notes: Between M.9 and M.26 in size; winter hardy (zone 4 to 5) and resists fire blight and collar rot, but not woolly apple aphid.
      - id: g16
        name: G.16
        sizePercent: { min: 35, max: 45 }
        support: always
        notes: Like M.9 in size, with better anchorage; resists fire blight and collar rot. Use only virus-free scion wood.
      - id: m26
        name: M.26
        sizePercent: { min: 40, max: 60 }
        spacingCm: { inRow: 240, betweenRows: 490 }
        support: always
        notes: Very winter hardy, but very prone to fire blight and collar rot, and grows burr knots. Kentucky and New Hampshire advise a stake for life.
      - id: g935
        name: G.935
        sizePercent: { min: 40, max: 55 }
        spacingCm: { inRow: 230, betweenRows: 400 }
        support: always
        notes: Slightly larger than M.26 and very productive; resists fire blight and collar rot but not woolly apple aphid. Cornell found it loses winter hardiness early.
      - id: bud-10
        name: Bud 10 (B.10)
        sizePercent: { min: 40, max: 40 }
        spacingCm: { inRow: 230, betweenRows: 400 }
        notes: Cold hardy and well anchored; tolerates fire blight.
  semiDwarf:
    spacingCm: { inRow: 420, betweenRows: 540 }
    heightM: { min: 3.5, max: 5 }
    yearsToFruit: { min: 3, max: 5 }
    named:
      - id: g202
        name: G.202
        sizePercent: { min: 50, max: 55 }
        notes: Resists fire blight, collar rot, and woolly apple aphid.
      - id: g30
        name: G.30
        sizePercent: { min: 50, max: 70 }
        notes: Very winter hardy and better anchored than M.7, but the graft union is weak in early years with some varieties; support depends on the site.
      - id: m7
        name: M.7
        sizePercent: { min: 60, max: 90 }
        spacingCm: { inRow: 360, betweenRows: 600 }
        support: young
        notes: Cold hardy and tolerates many soils, but not heavy clay; shallow roots and many suckers. Stake it for the first four or five years.
      - id: g969
        name: G.969
        sizePercent: { min: 60, max: 70 }
        support: none
        notes: Winter hardy, with few suckers or burr knots; tolerates fire blight, collar rot, and woolly apple aphid.
      - id: g890
        name: G.890
        sizePercent: { min: 60, max: 80 }
        support: none
        notes: Cold hardy and very productive; resists fire blight, collar rot, and woolly apple aphid.
      - id: mm106
        name: MM.106
        sizePercent: { min: 60, max: 80 }
        support: none
        notes: Well anchored and productive, but prone to collar and root rot, so not for poorly drained soil, and to injury from early winter freezes.
      - id: mm111
        name: MM.111
        sizePercent: { min: 70, max: 90 }
        spacingCm: { inRow: 550, betweenRows: 790 }
        support: none
        notes: Very cold hardy (zone 3 to 4) and the best semi-dwarf for heavy soil; tolerates drier soil and resists woolly apple aphid. Slow to come into bearing.
      - id: bud-118
        name: Bud 118 (B.118)
        sizePercent: { min: 75, max: 90 }
        support: none
        notes: Extremely winter hardy (zone 3), well anchored, and productive; suits spur-type varieties and poor soil.
  standard:
    spacingCm: { inRow: 750, betweenRows: 900 }
    heightM: { min: 6, max: 9 }
    yearsToFruit: { min: 5, max: 8 }
    named:
      - id: antonovka
        name: Antonovka
        sizePercent: { min: 100, max: 100 }
        spacingCm: { inRow: 610, betweenRows: 910 }
        notes: A hardy Russian seedling rootstock for full-size trees, rated to zone 3; the hardiest of the common apple rootstocks.
      - id: apple-seedling
        name: Seedling
        sizePercent: { min: 100, max: 100 }
        notes: Grown from seed of a hardy variety (zone 3); excellent hardiness, anchorage, and soil tolerance.
soilPh: { min: 6.0, max: 7.0 }
cropCoefficients:
  initial: 0.45
  mid: 0.95
  end: 0.7
  stageDays: { initial: 20, development: 70, mid: 90, late: 30 }
windows:
  transplant: { frost: last, weeksEarliest: -4, weeksLatest: -2 }
varieties:
  - id: apple-honeycrisp
    name: Honeycrisp
notes: The rootstock sets the final size, so check it when buying; the default spacing is for a semi-dwarf tree. Most apples need a second, different variety nearby that blooms at the same time. Trees start fruiting in two to five years.
sources:
  - source: wikidata
    fields: [scientificName, family]
  - source: hand-curation
