notes: Grown for its leaves, which are rich in potassium and break down fast, as a mulch, compost material, or soaked into a liquid feed; bumblebees work the flowers. Most gardeners plant Russian comfrey 'Bocking 14' (Symphytum × uplandicum), which sets no seed, from root cuttings. Any piece of root left in the ground regrows, so choose a permanent spot. Contains pyrrolizidine alkaloids, which harm the liver; do not eat it or drink it as tea.
