      - id: pyro-222
        name: Pyro 222
        sizePercent: { min: 70, max: 80 }
        notes: Precocious and productive; tolerates a wide range of soils.
      - id: ohxf-87
        name: OHxF 87
        sizePercent: { min: 85, max: 90 }
        notes: The most precocious Old Home x Farmingdale; winter hardy, well anchored, does not sucker, and resists fire blight.
      - id: ohxf-40
        name: OHxF 40
        notes: About two-thirds of standard size; resists fire blight, crown rot, and pear decline.
