      - id: calleryana
        name: Calleryana (Pyrus calleryana)
        notes: Preferred in the Southeast for European and Asian pears.
      - id: betulifolia
        name: Betulifolia (Pyrus betulifolia)
        notes: Vigorous and tolerates heavy, wet soil; suits Asian pears, but is less winter hardy than other pear rootstocks. Sources differ on its fire blight tolerance.
