notes: English lavender. Usually started from cuttings, since seed is slow and takes months to reach planting size. Needs sharp drainage and little water or fertilizer; wet soil rots the roots, and rich feeding gives leaves over flowers. Fall planting works only with about two months of mild weather before winter. Values from Utah State and Florida extension guides. Crop coefficients from Pereira et al. (2024), Irrigation Science 42:1199–1228, doi:10.1007/s00271-024-00960-4 (CC BY 4.0).
