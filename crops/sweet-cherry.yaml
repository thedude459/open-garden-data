      - id: krymsk-5
        name: Krymsk 5
        sizePercent: { min: 80, max: 90 }
        notes: Excellent cold and heat tolerance (USDA zone 5) and anchorage; suits heavier soils.
      - id: krymsk-6
        name: Krymsk 6
        sizePercent: { min: 70, max: 90 }
        notes: Hardier than sweet cherry seedlings (USDA zone 5) and tolerates heat; suits heavier soils.
