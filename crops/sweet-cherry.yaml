        notes: Slightly dwarfing and very drought tolerant, but very sensitive to waterlogged soil; resists bacterial canker.
      - id: colt
        name: Colt
        sizePercent: { min: 100, max: 100 }
        notes: Tolerates wet, heavy soil better than Mahaleb or Gisela 5, but is not cold hardy.
