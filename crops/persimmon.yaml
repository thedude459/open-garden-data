notes: A native fruit tree hardy to zone 5. Sources differ on pollination; some named varieties bear alone, but planting two trees gives the most reliable crop. Fruit ripens late in fall and is astringent until fully soft. Asian persimmons are less hardy, surviving only to about -12 °C. Values from Illinois, Oregon State, Penn State, Missouri, and North Carolina State guides.
