notes: American and cold-hardy hybrid grapes for eating, juice, and wine; hardiness depends on the variety, from Marquette and Bluebell (zone 3 to 4) to Concord (zone 5). American varieties are the hardiest and most disease resistant; European wine grapes need milder winters. Needs a trellis and pruning every year. Values from Illinois, Minnesota, Oregon State, and Penn State guides and the Fedco Trees catalog (2026); crop coefficients from FAO-56 Table 12 (table grapes).
