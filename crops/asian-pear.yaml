  - id: asian-pear-olympic
    name: Olympic
    notes: Also called Korean Giant. Large, late, golden russet fruit.
notes: Partly self-fruitful, but crops much better with two or more varieties planted together. About as winter hardy as Bosc pear, to roughly -29 °C, though less hardy than Bartlett. The crisp fruit has tender skin that bruises easily. European pear rootstocks such as OHxF 87 and 97 also take it and dwarf it somewhat. Values from University of California, North Carolina State, Georgia, and Penn State extension guides; crop coefficients from FAO-56 Table 12 (pears).
