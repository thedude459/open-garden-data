notes: A lemon-scented mint relative that forms large clumps and grows in sun or part shade. It self-sows freely, so cut off the flowers; cutting hard after flowering also brings fresh leaves. Seed is slow to germinate. Values from Wisconsin and Clemson extension guides. Crop coefficients from Pereira et al. (2024), Irrigation Science 42:1199–1228, doi:10.1007/s00271-024-00960-4 (CC BY 4.0).
