notes: American elderberry, a large shrub 2 to 2.5 m tall and wide. Only partly self-fruitful, so plant two varieties for good crops. Tolerates some shade but fruits best in full sun; prune every year. In zone 3 it survives but may not ripen. Values from Utah State, Minnesota, and Wisconsin extension guides; crop coefficients from FAO-56 Table 12 (berries, bushes).
