notes: Usually self-fruitful, but crops better with a second variety that blooms at the same time. It blooms very early, so spring frost often takes the crop even in zones where the tree is hardy; choose later-blooming varieties and a slope, not a frost pocket. Poor in wet or heavy soil. Values from Utah State extension; crop coefficients from FAO-56 Table 12 (stone fruit).
