notes: Always sown in place. Pull roots at 5 to 7 cm across; the leaves are good as greens at any size, though picking many slows the root. Tastes best when it grows fast in cool weather; even moisture keeps roots from cracking or turning bitter. Values from Utah State, Clemson, Colorado State, and Penn State extension guides; crop coefficients from FAO-56 Table 12.
